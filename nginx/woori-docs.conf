server {
    listen 80;
    server_name www.woori.today woori.today;

    location = /docs-sitemap.xml {
        proxy_pass http://woori-docs:3004;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /_assets/docs/favicon.ico {
        proxy_pass http://woori-docs:3004/favicon.ico;
        proxy_set_header Host $host;
    }

    location ^~ /_assets/docs/_next/ {
        proxy_pass http://woori-docs:3004/_next/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /_assets/docs/ {
        proxy_pass http://woori-docs:3004;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ "^/[a-z]{2}(?:-[a-z]{2})?/docs(?:/.*)?$" {
        proxy_pass http://woori-docs:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
